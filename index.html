<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Borsha! 🎉</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Pacifico&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0b2e 0%, #3b185f 50%, #a12568 100%);
            font-family: 'Hind Siliguri', sans-serif;
            color: #fff;
            overflow-x: hidden;
            padding: 12px;
        }

        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .welcome-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 7, 38, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .welcome-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gift-bounce {
            font-size: 68px;
            animation: bounceGift 1.2s infinite;
            margin-bottom: 14px;
        }

        @keyframes bounceGift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.15) rotate(5deg); }
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.11);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            padding: 22px 18px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        }

        .photo-frame {
            width: 105px;
            height: 105px;
            margin: 0 auto 10px;
            border-radius: 50%;
            padding: 3.5px;
            background: linear-gradient(45deg, #ff416c, #ffd700, #00e676);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.5);
            animation: floatPhoto 3s ease-in-out infinite;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 50%;
            border: 2.5px solid #2b1046;
            background: #2b1046;
        }

        @keyframes floatPhoto {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
