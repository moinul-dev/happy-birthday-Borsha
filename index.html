<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Borsha! 🎉</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Pacifico&family=Poppins:ital,wght@0,500;0,600;1,500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0b2e 0%, #3b185f 50%, #a12568 100%);
            font-family: 'Hind Siliguri', sans-serif;
            color: #fff;
            overflow-x: hidden;
            padding: 12px;
        }

        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .welcome-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 7, 38, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .welcome-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gift-bounce {
            font-size: 68px;
            animation: bounceGift 1.2s infinite;
            margin-bottom: 14px;
        }

        @keyframes bounceGift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.15) rotate(5deg); }
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.11);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            padding: 20px 16px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        }

        .photo-frame {
            width: 98px;
            height: 98px;
            margin: 0 auto 8px;
            border-radius: 50%;
            padding: 3.5px;
            background: linear-gradient(45deg, #ff416c, #ffd700, #00e676);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.5);
            animation: floatPhoto 3s ease-in-out infinite;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 50%;
            border: 2.5px solid #2b1046;
            background: #2b1046;
        }

        @keyframes floatPhoto {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 1.7rem;
            background: linear-gradient(to right, #ff9a9e, #fecfef, #ffdde1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3px;
            line-height: 1.25;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #f8bbd0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .lyrics-box {
            margin: 8px auto 12px;
            padding: 10px 14px;
            min-height: 54px;
            background: linear-gradient(135deg, rgba(255, 65, 108, 0.22), rgba(255, 215, 0, 0.12));
            border: 1px solid rgba(255, 128, 171, 0.4);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .lyric-line {
            font-family: 'Poppins', sans-serif;
            font-size: 0.91rem;
            font-weight: 600;
            color: #ffe082;
            text-shadow: 0 0 10px rgba(255, 224, 130, 0.5);
            letter-spacing: 0.2px;
            line-height: 1.35;
        }

        .lyric-line.pop {
            animation: lyricPop 0.28s ease forwards;
        }

        @keyframes lyricPop {
            0% { opacity: 0.3; transform: translateY(5px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .cake-section { margin: 6px auto 12px; cursor: pointer; user-select: none; }

        .cake-hint {
            font-size: 0.83rem;
            color: #ffe082;
            margin-bottom: 5px;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .cake-container { position: relative; width: 120px; height: 86px; margin: 0 auto; }

        .candle {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            width: 10px; height: 24px;
            background: repeating-linear-gradient(45deg, #fff, #fff 4px, #ff416c 4px, #ff416c 8px);
            border-radius: 3px;
            z-index: 3;
        }

        .flame {
            position: absolute;
            top: -15px; left: 50%;
            transform: translateX(-50%);
            width: 12px; height: 17px;
            background: radial-gradient(circle at 50% 80%, #fff 10%, #ffeb3b 45%, #ff9800 80%, transparent 100%);
            border-radius: 50% 50% 35% 35%;
            box-shadow: 0 0 14px #ff9800, 0 0 22px #ffeb3b;
            animation: flicker 0.15s infinite alternate;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .flame.out { opacity: 0; transform: translateX(-50%) scale(0); }

        .smoke {
            position: absolute;
            top: -18px; left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
        }

        .smoke.rise { animation: smokeRise 1.5s ease-out forwards; }

        @keyframes smokeRise {
            0% { opacity: 0.9; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -24px) scale(1.4); }
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) rotate(-3deg) scale(1); }
            100% { transform: translateX(-50%) rotate(3deg) scale(1.08); }
        }

        .cake-top {
            position: absolute;
            top: 34px; left: 50%;
            transform: translateX(-50%);
            width: 86px; height: 22px;
            background: #ff80ab;
            border-radius: 10px 10px 4px 4px;
            border-bottom: 4px solid #fff;
            z-index: 2;
        }

        .cake-bottom {
            position: absolute;
            top: 55px; left: 50%;
            transform: translateX(-50%);
            width: 112px; height: 26px;
            background: #f06292;
            border-radius: 7px 7px 12px 12px;
            box-shadow: 0 5px 0 #ad1457;
            z-index: 1;
        }

        .btn-group { display: flex; flex-direction: column; gap: 7px; align-items: center; }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.5);
            transition: all 0.3s ease;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .btn:active { transform: scale(0.96); }

        .mic-btn {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffe082;
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .music-toggle {
            display: inline-block;
            margin: 10px auto 0;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffdde1;
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .message-box {
            margin-top: 12px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.32);
            border-radius: 14px;
            border-left: 3.5px solid #ff416c;
            text-align: left;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-box p { font-size: 0.92rem; line-height: 1.52; color: #fff; margin-bottom: 6px; }
        .message-box p:last-child { margin-bottom: 0; }
        .highlight { color: #ff80ab; font-weight: 700; }
        .footer-tag { margin-top: 10px; font-size: 0.8rem; color: rgba(255, 255, 255, 0.78); }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <audio id="bgMusic" src="Dilruba.mp3" preload="auto"></audio>

    <div class="welcome-overlay" id="welcomeScreen" onclick="startExperience()">
        <div class="gift-bounce">🎁</div>
        <h2 style="font-size: 1.4rem; margin-bottom: 8px; color: #ffdde1;">বর্ষার জন্য একটি স্পেশাল সারপ্রাইজ আছে! ✨</h2>
        <p style="color: #f8bbd0; margin-bottom: 22px; font-size: 0.95rem;">ওপেন করতে নিচের বাটনে টাচ করো</p>
        <button class="btn">🎉 সারপ্রাইজটি ওপেন করো</button>
    </div>

    <div class="card">
        <div class="photo-frame">
            <img id="bors
